<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chave Mestra</title>
<meta name="description" content="Gestão de aluguéis e caixa mensal.">
<meta name="theme-color" content="#1F5F6B">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231F5F6B' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='8' cy='15' r='4'/%3E%3Cpath d='M11 12l9-9M17 6l3 3M15 8l2 2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E9EDE8; --line:#D6DDD6;
  --ink:#18272B; --muted:#5F6F72; --accent:#1F5F6B; --accent-ink:#FFFFFF; --accent-soft:#DCEBEC;
  --pos:#23744A; --pos-soft:#DDEFE3; --neg:#B0402C; --neg-soft:#F6E1DC; --warn:#9A6A00; --warn-soft:#F5ECD2;
  --shadow:0 1px 2px rgba(24,39,43,.06),0 6px 20px rgba(24,39,43,.06);
  --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111A1C; --surface:#182427; --surface-2:#203033; --line:#2D3F42;
  --ink:#E6EEEC; --muted:#93A5A7; --accent:#6FB6C2; --accent-ink:#0D1B1E; --accent-soft:#1E3A3F;
  --pos:#6CC792; --pos-soft:#1B3527; --neg:#EE8B76; --neg-soft:#3D2420; --warn:#E3B65A; --warn-soft:#3A3120;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111A1C; --surface:#182427; --surface-2:#203033; --line:#2D3F42;
  --ink:#E6EEEC; --muted:#93A5A7; --accent:#6FB6C2; --accent-ink:#0D1B1E; --accent-soft:#1E3A3F;
  --pos:#6CC792; --pos-soft:#1B3527; --neg:#EE8B76; --neg-soft:#3D2420; --warn:#E3B65A; --warn-soft:#3A3120;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:transparent;width:30px;height:30px;border-radius:6px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav h1{font-family:var(--display);font-size:clamp(26px,5vw,38px);margin:0;min-width:0;text-transform:capitalize;letter-spacing:-.01em;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.closed{background:var(--surface-2);color:var(--muted)}
.pill.future{background:var(--warn-soft);color:var(--warn)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.strip{display:grid;grid-template-columns:auto repeat(12,minmax(0,1fr));gap:6px;align-items:stretch;margin-bottom:20px}
.yr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.yr b{font-family:var(--display);font-size:17px}
.yr div{display:flex}
.mchip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.mchip .mn{font-weight:700;text-transform:capitalize;font-size:13px}
.mchip .ms{font-size:10.5px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mchip .st{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mchip:hover{border-color:var(--accent)}
.mchip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mchip[aria-current="true"] .ms,.mchip[aria-current="true"] .st{color:var(--accent-ink)}
.mchip.today:not([aria-current="true"]){border-color:var(--accent);border-width:2px}
@media (max-width:900px){.strip{grid-template-columns:repeat(6,minmax(0,1fr))}.yr{grid-column:1 / -1;flex-direction:row;justify-content:space-between}}
@media (max-width:420px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:500}

.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.summary > div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.summary .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.summary .val{font-size:clamp(17px,2.6vw,22px);font-weight:600;overflow-wrap:anywhere}
.summary .sub{font-size:12px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%}
.card-h .tot{font-weight:600}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.done .desc{color:var(--muted)}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;color:transparent}
.chk[aria-pressed="true"]{background:var(--pos);border-color:var(--pos);color:#fff}
.chk:disabled{cursor:default}
.desc{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);font-weight:600}
.tag.tr{background:var(--accent-soft);color:var(--accent)}
.quick{display:grid;grid-template-columns:minmax(0,1fr) 110px auto auto;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.quick input:not([type=checkbox]){font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.quick .num{text-align:right}
.qpago{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.qpago input{accent-color:var(--accent)}
.btn.qr{background:var(--pos);border-color:var(--pos);color:#fff}.btn.qd{background:var(--neg);border-color:var(--neg);color:#fff}
@media (max-width:520px){.quick{grid-template-columns:1fr 1fr}.quick input:first-child{grid-column:1/-1}}
.racts{display:flex;gap:2px}
.tag.adj{background:var(--warn-soft);color:var(--warn)}
.amt{border:1px dashed transparent;background:transparent;padding:4px 6px;border-radius:6px;font-weight:600;text-align:right}
.amt:hover:not(:disabled){border-color:var(--line)}
.amt:disabled{cursor:default}
.amt-input{width:110px;font:600 14px var(--mono);text-align:right;padding:4px 6px;border:1px solid var(--accent);border-radius:6px;background:var(--surface);color:var(--ink)}
.empty{padding:22px 14px;color:var(--muted);text-align:center}
.card-f{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}

.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:20px 0}
.cat{padding:14px;display:grid;gap:10px}
.cat-row{display:grid;grid-template-columns:minmax(90px,160px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--neg);border-radius:5px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr.cur td{background:var(--accent-soft)}
td .link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-transform:capitalize}
.chart{padding:14px 10px 6px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:0 14px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.note{font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}

.overlay{position:fixed;inset:0;background:rgba(10,20,22,.45);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet h3{font-family:var(--display);font-size:20px;margin:0;padding:18px 18px 4px}
.sheet p{margin:0;padding:0 18px;color:var(--muted)}
.sheet form,.sheet .body{padding:14px 18px;display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);padding:4px;border-radius:9px;gap:4px}
.seg button{border:0;background:transparent;padding:8px;border-radius:6px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].r{background:var(--pos);color:#fff}
.seg button[aria-pressed="true"].d{background:var(--neg);color:#fff}
.sheet-f{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:6px 18px 18px}
.choices{display:grid;gap:8px;padding:14px 18px}
.choices button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px}
.choices button:hover{border-color:var(--accent)}
.choices button b{display:block}
.choices button small{color:var(--muted)}
.choices button.danger b{color:var(--neg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.status-line{font-size:12px;color:var(--muted);margin-top:26px;text-align:center}

@media (max-width:820px){.cols{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.row{grid-template-columns:auto 1fr auto;}.row .more{grid-column:3}.row .amt-cell{grid-column:2 / 4;justify-self:end}}

.appbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.logo svg{width:24px;height:24px;color:var(--accent)}
.switch{display:flex;background:var(--surface-2);padding:4px;border-radius:11px;gap:4px}
.switch button{border:0;background:transparent;padding:9px 18px;border-radius:8px;font-weight:700;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cm{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.side button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.side button:hover{background:var(--surface-2);color:var(--ink)}
.side button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.side .count{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.side .count.bad{background:var(--neg);color:#fff;border-radius:999px;padding:0 7px}
.modh{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.modh h1{font-family:var(--display);font-size:clamp(24px,4vw,32px);margin:0;letter-spacing:-.01em}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;width:200px;max-width:100%}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--pos-soft);color:var(--pos)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--neg-soft);color:var(--neg)}.badge.info{background:var(--accent-soft);color:var(--accent)}
table.cmt th,table.cmt td{text-align:left;white-space:normal;vertical-align:top}
table.cmt th.r,table.cmt td.r{text-align:right;white-space:nowrap}
table.cmt td.act{white-space:nowrap;text-align:right;padding-block:6px}
table.cmt td .meta{margin-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.summary.k6{grid-template-columns:repeat(4,minmax(0,1fr))}
.pgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pgroup{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;display:grid;gap:6px;align-content:start}
.pgroup legend{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);padding:0 4px}
.chk-l{display:flex;gap:8px;align-items:flex-start;cursor:pointer;line-height:1.35}
.chk-l input{margin-top:2px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.chk-l small{display:block}
table.cmt.mini th,table.cmt.mini td{padding:6px 10px;font-size:12.5px;white-space:nowrap}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchk{position:relative;cursor:pointer}
.mchk input{position:absolute;opacity:0;width:1px;height:1px}
.mchk span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.mchk span::before{content:"";width:14px;height:14px;border:1.5px solid var(--line);border-radius:4px;flex:none}
.mchk input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.mchk input:checked+span::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--surface)}
.mchk input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.cats{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.steps{display:grid;gap:16px}
.stepn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;margin-right:4px}
a.btn{text-decoration:none}
.msgprev{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px 14px;font-size:13.5px;max-height:260px;overflow:auto}
.side .count.warnc{background:var(--warn);color:#fff;border-radius:999px;padding:0 7px}
.pcrow{flex-wrap:wrap}
.pcact{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.pcf{display:grid;gap:3px}.pcf label{font-size:11px;font-weight:600;color:var(--muted)}
.pcf select{max-width:260px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rcard{display:flex;flex-direction:column}
.rbody{padding:16px;flex:1;display:grid;gap:6px;align-content:start}
.rbody h2{margin:0;font-size:16px}
.rfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.muted{color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.withthumb{display:flex;gap:10px;align-items:center}
.thumb{width:52px;height:40px;border-radius:6px;object-fit:cover;flex:none;background:var(--surface-2);display:inline-grid;place-items:center;color:var(--muted);vertical-align:middle}
.card-h h2 .thumb{width:34px;height:26px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:260px}
.fsec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent);padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.fgrid > .fsec:first-child{border-top:0;margin-top:0;padding-top:0}
.media{display:grid;gap:8px}
.mlist{display:flex;flex-wrap:wrap;gap:8px}
.mlist:empty{display:none}
.mitem{position:relative;width:110px;height:82px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.mitem img,.mitem video{width:100%;height:100%;object-fit:cover;display:block}
.mdel{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.mdel svg{width:13px;height:13px}
.vtag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:2px 4px;display:grid}
.vtag svg{width:12px;height:12px}
.upl{justify-self:start;position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.pcard{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.pcard .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pcard.im{grid-column:1/-1;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.pcard.im img{width:96px;height:72px;object-fit:cover;border-radius:8px}
.pcard.im > div{display:grid;gap:2px;min-width:0}
.warnt{color:var(--warn);font-weight:600}
.warnbox{background:var(--warn-soft);color:var(--warn)!important;margin:10px 18px 0!important;padding:10px 12px!important;border-radius:8px;font-weight:500}
.doc{background:#fff;color:#1b1b1b;border:1px solid var(--line);border-radius:8px;padding:28px clamp(16px,4vw,40px);font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.65;max-height:58vh;overflow:auto}
.doc p{margin:0 0 .9em;padding:0;text-align:justify}
.doc p.h{text-align:center;font-weight:700;font-size:16px;margin-bottom:1.4em}
.doc p.cl{margin-top:1.3em}
.doc p.cl::first-line{font-weight:700}
.doc p.sig{margin-top:2em;text-align:left}
.doc .fill{background:#e7f1f2;border-radius:3px;padding:0 2px}
.doc mark{background:#ffe58a;color:#5a4300;border-radius:3px;padding:0 2px}
.subtabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;margin-bottom:16px;width:fit-content;max-width:100%}
.subtabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.gal img,.gal video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;background:#000;max-width:100%}
.mdtxt{font:13px/1.55 var(--mono);min-height:380px;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font:12px var(--mono)}
.chip span{font-family:var(--body);color:var(--muted)}
@media (max-width:820px){.summary.k6{grid-template-columns:repeat(2,minmax(0,1fr))}.pcards{grid-template-columns:1fr}}

.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;align-items:start}
.panels .full{grid-column:1/-1}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.trio div{display:flex;flex-direction:column;align-items:center;padding:10px;gap:2px}
.trio div+div{border-left:1px solid var(--line)}
.trio b{font-size:22px}.trio span{font-size:12px;color:var(--muted)}
.sheet:has(.wide){width:min(720px,100%)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.field textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-height:72px;resize:vertical}
.calc{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
@media (max-width:820px){.cm{grid-template-columns:1fr}.side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}.side button{white-space:nowrap}.panels{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.summary.k6{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.6}}}
.lstrong{font-weight:800!important;color:var(--ink)!important}
.mphoto .mitem{width:min(260px,100%);height:170px}
.mitem img{transition:transform .18s ease,box-shadow .18s;cursor:zoom-in;transform-origin:center}
.mitem:hover{overflow:visible;z-index:6}
.mitem:hover img{transform:scale(1.7);box-shadow:0 10px 30px rgba(0,0,0,.35);border-radius:8px;position:relative;z-index:6}
.mitem:hover .mdel{z-index:7}
img.thumb[data-zoom]{cursor:zoom-in;transition:transform .18s ease}
img.thumb[data-zoom]:hover{transform:scale(2.6);position:relative;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.pcard.im img{cursor:zoom-in}
.gal img{cursor:zoom-in}
.lbx{position:fixed;inset:0;z-index:200;background:rgba(8,14,16,.9);display:flex;flex-direction:column}
.lbx-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.lbx-bar button,.lbx-bar a{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:7px 12px;font:600 13px var(--body);text-decoration:none;cursor:pointer}
.lbx-img{flex:1;overflow:auto;display:grid;place-items:center;padding:10px}
.lbx-img img{max-width:94vw;max-height:84vh;object-fit:contain;transition:transform .2s ease;border-radius:6px;background:#111}
@media (hover:none){.mitem:hover img,img.thumb[data-zoom]:hover{transform:none;box-shadow:none}}
.consbox{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.conslinks{display:flex;flex-wrap:wrap;gap:6px}
.conslinks a.btn{text-decoration:none}
.mpdf{display:grid;place-items:center;align-content:center;gap:4px;width:100%;height:100%;background:var(--surface-2);color:var(--ink);text-decoration:none;padding:8px;text-align:center}
.mpdf b{background:var(--neg);color:#fff;border-radius:6px;padding:4px 10px;font-size:13px}
.mpdf span{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
</style>

<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 22px;display:grid;gap:14px}
.auth-card .logo{margin-bottom:2px}
.auth-card h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-.01em}
.auth-card p{margin:0}
.auth-card form{display:grid;gap:12px}
.auth .field input{font-size:16px}
.btn.big{width:100%;justify-content:center;padding:11px 14px;font-size:15px}
.alinks{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:2px;font-size:13.5px}
.aerr{color:var(--neg);font-size:13px;min-height:1em}
.aok{background:var(--pos-soft);color:var(--pos);border-radius:8px;padding:10px 12px;font-weight:500}
.abox{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:13.5px}
.auth-wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600;justify-content:center;padding:18px 0}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.acct .btn{max-width:220px}
.acct .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.plist.contas li{flex-wrap:wrap;padding-inline:0}
.plist.contas .tools{margin-left:auto}
@media (max-width:640px){.appbar .switch{order:3;width:100%}.appbar .switch button{flex:1}}
</style>
</head>
<body>

<div id="auth" class="auth">
  <div class="auth-card">
    <div class="logo"><svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>Chave Mestra</div>
    <div id="authBody" style="display:grid;gap:14px"><div class="auth-wait" role="status"><span class="spin" aria-hidden="true"></span>Carregando…</div></div>
  </div>
</div>

<div class="wrap" id="appWrap" hidden>
  <div class="appbar">
    <div class="logo"><svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>Chave Mestra</div>
    <div class="switch" role="group" aria-label="Escolher área">
      <button data-app="cm" aria-pressed="true">Aluguéis</button>
      <button data-app="caixa" aria-pressed="false">Caixa Mensal</button>
    </div>
    <div class="acct"><button class="btn" id="acctBtn" title="Minha conta, backup e sair"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span id="acctNome">Conta</span></button></div>
  </div>
  <div id="alvoBanner" class="banner info" hidden></div>

  <section id="app-cm">
    <div id="cmBanner" class="banner" hidden>
      <span>Estes cadastros de aluguéis são de exemplo. Edite, exclua ou apague todos para começar do zero.</span>
      <button class="btn" id="cmClear">Apagar exemplos</button>
    </div>
    <div class="cm">
      <nav class="side" id="cmSide" aria-label="Módulos"></nav>
      <div id="cmMain"><div class="empty">Carregando…</div></div>
    </div>
    <div class="status-line" id="cmStatus"></div>
  </section>

  <section id="app-caixa" hidden>
  <header class="top">
    <div>
      <div class="brand">Caixa Mensal · receitas e despesas</div>
      <div class="month-nav">
        <button class="icon-btn" id="prev" aria-label="Mês anterior"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h1 id="monthTitle">—</h1>
        <button class="icon-btn" id="next" aria-label="Próximo mês"><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        <span id="monthPill" class="pill open">Aberto</span>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-mes" aria-selected="true">Mês</button>
      <button role="tab" id="tab-prev" aria-selected="false">Projeção do ano</button>
      <button role="tab" id="tab-hist" aria-selected="false">Arquivo</button>
    </div>
  </header>

  <nav class="strip" id="strip" aria-label="Escolher mês"></nav>

  <div id="banner" class="banner" hidden>
    <span>Estes lançamentos são de exemplo. Edite, exclua ou apague todos para começar do zero.</span>
    <button class="btn" id="clearExamples">Apagar exemplos</button>
  </div>

  <section id="view-mes"></section>
  <section id="view-prev" hidden></section>
  <section id="view-hist" hidden></section>

  <div class="status-line" id="statusLine">Carregando…</div>
  </section>
</div>
<div id="modalRoot"></div>

<script src="config.js?v=1"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="shell.js?v=1"></script>
</body>
</html>
